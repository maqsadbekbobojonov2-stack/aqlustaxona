name: Kunlik post — AQLUSTAXONA

on:
  schedule:
    # Barcha vaqtlar UTC. Toshkent = UTC+5.
    # GitHub cron kechikishi mumkin — shuning uchun erta boshlanadi,
    # aniq chiqish vaqtini skript o'zi kutadi.
    - cron: "15 3 * * *"     # 08:45 Toshkent — ertalabki hikoya
    - cron: "5 14 * * *"     # 19:45 Toshkent — kurs yoki yangilik
    - cron: "30 15 * * 0"    # yakshanba 20:30 — haftalik ko'rik
  workflow_dispatch:
    inputs:
      slot:
        description: "Qaysi slot"
        type: choice
        options: [kechqurun, ertalab]
        default: kechqurun
      run_now:
        description: "Jadvalni kutmasdan hoziroq chiqarish"
        type: boolean
        default: true
      preview_only:
        description: "Faqat preview (kanalga chiqarmaslik)"
        type: boolean
        default: false
      doctor:
        description: "Diagnostika: sozlamalarni tekshirish"
        type: boolean
        default: false
      weekly:
        description: "Haftalik ko'rik: 7 kunlik postlarni adminga yuborish"
        type: boolean
        default: false
      day:
        description: "Aniq hikoya raqami (bo'sh — navbatdagisi)"
        required: false
        default: ""
      dars:
        description: "Aniq kurs darsi raqami (bo'sh — navbatdagisi)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pillow

      - name: Postni yaratish va chiqarish
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:    ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_ID:   ${{ secrets.TELEGRAM_ADMIN_ID }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:    ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:    ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4:    ${{ secrets.GEMINI_API_KEY_4 }}
          GROK_API_KEY:        ${{ secrets.GROK_API_KEY }}
          GROK_API_KEY_2:      ${{ secrets.GROK_API_KEY_2 }}
          GITHUB_TOKEN:        ${{ github.token }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POST_SOURCE:         ${{ vars.POST_SOURCE }}
          DRY_RUN:             ${{ vars.DRY_RUN || '0' }}
          TIMEZONE:            "Asia/Tashkent"
          SCHEDULE:            ${{ github.event.schedule }}
          IN_SLOT:             ${{ github.event.inputs.slot }}
        run: |
          set -e

          # ── Slot va chiqish vaqtini aniqlash ──────────────────
          case "$SCHEDULE" in
            "15 3 * * *")   SLOT=ertalab;   PUBLISH_TIME=${{ vars.ERTALAB_VAQT || '08:45' }} ;;
            "5 14 * * *")   SLOT=kechqurun; PUBLISH_TIME=${{ vars.KECHQURUN_VAQT || '19:45' }} ;;
            "30 15 * * 0")  SLOT=haftalik ;;
            *)              SLOT=${IN_SLOT:-kechqurun}
                            if [ "$SLOT" = "ertalab" ]; then
                              PUBLISH_TIME=${{ vars.ERTALAB_VAQT || '08:45' }}
                            else
                              PUBLISH_TIME=${{ vars.KECHQURUN_VAQT || '19:45' }}
                            fi ;;
          esac
          export SLOT PUBLISH_TIME
          echo "SLOT=$SLOT  PUBLISH_TIME=$PUBLISH_TIME"

          # ── Haftalik ko'rik ────────────────────────────────────
          if [ "$SLOT" = "haftalik" ] || [ "${{ github.event.inputs.weekly }}" = "true" ]; then
            export SLOT=kechqurun
            python bot.py --weekly
            exit $?
          fi

          # ── Diagnostika ────────────────────────────────────────
          if [ "${{ github.event.inputs.doctor }}" = "true" ]; then
            python bot.py --doctor
            exit $?
          fi

          ARGS=""
          if [ "${{ github.event.inputs.run_now }}" = "true" ]; then ARGS="$ARGS --now"; fi
          if [ "${{ github.event.inputs.preview_only }}" = "true" ]; then ARGS="$ARGS --preview-only"; fi
          if [ -n "${{ github.event.inputs.day }}" ]; then ARGS="$ARGS --day ${{ github.event.inputs.day }}"; fi
          if [ -n "${{ github.event.inputs.dars }}" ]; then ARGS="$ARGS --dars ${{ github.event.inputs.dars }}"; fi
          python bot.py $ARGS

      - name: Holatni saqlash
        if: always()
        run: |
          if [ -n "$(git status --porcelain history.json stories_state.json)" ]; then
            git config user.name  "aqlustaxona-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history.json stories_state.json
            git commit -m "chore: post tarixi $(date -u +%F)"
            git pull --rebase --autostash || true
            git push
          fi
