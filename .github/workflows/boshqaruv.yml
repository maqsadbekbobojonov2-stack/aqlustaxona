name: Bot boshqaruvi

# Telegram bot orqali kanalni boshqarish.
# Har 3 soatda qayta ishga tushadi (cancel-in-progress bilan eskisini
# almashtiradi) va 350 daqiqagacha tinglaydi — ya'ni deyarli uzluksiz.
# Har 3 soatda qayta urinish MUHIM: GitHub cron'i kafolatlanmagan,
# bitta jadval tashlab ketilsa keyingisi 3 soat ichida tiklaydi.
# Tirik turgan jarayon kunlik postlar uchun QOROVUL vazifasini bajaradi.
# Ochiq repo uchun Actions bepul.

on:
  schedule:
    - cron: "2 */3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Necha daqiqa tinglasin"
        required: false
        default: "350"

permissions:
  contents: write

concurrency:
  group: bot-listen
  cancel-in-progress: true

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow

      - name: Kod sintaksisini tekshirish
        run: python -m py_compile bot.py

      - name: Botni tinglash
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:    ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_ID:   ${{ secrets.TELEGRAM_ADMIN_ID }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:    ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:    ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4:    ${{ secrets.GEMINI_API_KEY_4 }}
          GROK_API_KEY:        ${{ secrets.GROK_API_KEY }}
          GROK_API_KEY_2:      ${{ secrets.GROK_API_KEY_2 }}
          GITHUB_TOKEN:        ${{ github.token }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TIMEZONE:            "Asia/Tashkent"
          ERTALAB_VAQT:        ${{ vars.ERTALAB_VAQT || '08:45' }}
          KECHQURUN_VAQT:      ${{ vars.KECHQURUN_VAQT || '19:45' }}
        run: python bot.py --listen --minutes ${{ github.event.inputs.minutes || '350' }}

      - name: Holatni saqlash
        if: always()
        run: |
          # history.json, maxsus_postlar.json, statistika.json,
          # takliflar.json va auditoriya.json ni bot GitHub API orqali
          # o'zi yozadi (sha bilan band qilib). Ularni bu yerda commit
          # qilsak — API yozgan yangi holat ustiga eski nusxa tushib,
          # yozuvlar jimgina yo'qolardi. Shuning uchun lokal nusxalarini
          # tashlab yuboramiz va faqat stories_state.json ni saqlaymiz.
          git checkout -- history.json maxsus_postlar.json statistika.json \
                          takliflar.json auditoriya.json 2>/dev/null || true
          if [ -n "$(git status --porcelain stories_state.json)" ]; then
            git config user.name  "aqlustaxona-bot"
            git config user.email "bot@users.noreply.github.com"
            git add stories_state.json
            git commit -m "chore: bot boshqaruvi $(date -u +%F)"
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then
                exit 0
              fi
              echo "push urinishi $i muvaffaqiyatsiz, qayta urinaman..."
              sleep 5
            done
            echo "::error::stories_state.json saqlanmadi — qo'lda tekshiring"
            exit 1
          fi
